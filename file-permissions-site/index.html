<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>File Permissions — Terminal Tutor</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #0c0c0c; /* Windows Terminal dark */
        color: #cccccc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        overflow: hidden; /* hide page scrollbar; use terminal's internal scroll */
      }
      .term {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #0c0c0c; /* terminal background */
        border-top: 1px solid #2a2a2a;
        border-bottom: 1px solid #2a2a2a;
      }
      .term-screen {
        padding: 12px 14px;
        overflow-y: auto;
        white-space: pre-wrap;
        flex: 1;
        background: #0c0c0c;
      }
      .term-input {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-top: 1px solid #2a2a2a;
        background: #0c0c0c;
      }
      .term-prompt {
        color: inherit;
        white-space: pre;
      }
      .prompt-userhost {
        color: #fce94f;
      } /* yellow */
      .prompt-path {
        color: #ef2929;
      } /* red */
      .prompt-dollar {
        color: #cccccc;
      }
      .ls-dir {
        color: #3b78ff; /* Campbell bright blue */
      }
      .term-instruction {
        font-style: italic;
        margin: 12px 0;
      }
      /* Inline, borderless editing next to the prompt */
      .term-line .term-input-editable {
        display: inline-block;
        min-width: 1ch;
        outline: none;
        border: none;
        background: transparent;
        color: inherit;
        font: inherit;
        white-space: pre;
        caret-color: #cccccc;
      }
      .term-input input {
        flex: 1;
        background: transparent;
        color: #e5e5e5;
        border: none;
        outline: none;
        font: inherit;
        padding: 0;
      }
      .title-line {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="term" id="term">
      <div class="term-screen" id="screen" aria-live="polite"></div>
    </div>

    <script>
      (function () {
        var screen = document.getElementById("screen");
        var input = null; // dynamically created per prompt line
        var activeLineEl = null;
        var term = document.getElementById("term");
        var currentUserhost = "hwwolverine@DESKTOP-WSL";
        var currentPathText = "~/Harvard-Westlake";
        var hideInput = false; // hide echo for secure input (sudo password)

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }
        function getPromptHtml() {
          return (
            '<span class="prompt-userhost">' +
            escapeHtml(currentUserhost) +
            "</span>:" +
            '<span class="prompt-path">' +
            escapeHtml(currentPathText) +
            "</span>" +
            '<span class="prompt-dollar">$</span>'
          );
        }
        function appendLine(text) {
          screen.insertAdjacentHTML(
            "beforeend",
            '<div class="term-line">' + escapeHtml(text) + "</div>"
          );
          screen.scrollTop = screen.scrollHeight;
        }
        function appendRawLine(html) {
          screen.insertAdjacentHTML(
            "beforeend",
            '<div class="term-line">' + html + "</div>"
          );
          screen.scrollTop = screen.scrollHeight;
        }
        function appendInstructionHtml(html) {
          screen.insertAdjacentHTML(
            "beforeend",
            '<div class="term-instruction"><em>' + html + "</em></div>"
          );
          screen.scrollTop = screen.scrollHeight;
        }
        function updatePrompt(userhost, pathText) {
          currentUserhost = userhost;
          currentPathText = pathText;
          // Update the visible current prompt, if present
          if (activeLineEl) {
            var promptSpan = activeLineEl.querySelector(".term-prompt");
            if (promptSpan) promptSpan.innerHTML = getPromptHtml();
          }
        }
        function createInputLine() {
          var line = document.createElement("div");
          line.className = "term-line";
          line.innerHTML =
            '<span class="term-prompt">' +
            getPromptHtml() +
            "</span> " +
            '<span class="term-input-editable" contenteditable="true" spellcheck="false" role="textbox" aria-label="Terminal command input"></span>';
          screen.appendChild(line);
          activeLineEl = line;
          input = line.querySelector(".term-input-editable");
          input.addEventListener("keydown", onKeyDown);
          screen.scrollTop = screen.scrollHeight;
          input.focus();
        }
        function finalizeCurrentInput(raw) {
          if (!activeLineEl) return;
          var promptHtml =
            '<span class="term-prompt">' + getPromptHtml() + "</span>";
          var suffix = "";
          if (!hideInput && raw && raw.length) {
            suffix = " " + escapeHtml(raw);
          }
          activeLineEl.innerHTML = promptHtml + suffix;
          activeLineEl = null;
          input = null;
        }

        // Focus input on load and on screen click
        window.addEventListener("load", function () {
          if (input) input.focus();
        });
        term.addEventListener("click", function () {
          if (input) input.focus();
        });

        // ===== Lesson Content (HTML, bold preserved) =====
        var textSections = [
          [
            "A <strong>file</strong> contains data that your operating system (Windows, Linux, macOS, etc.) stores. A <strong>directory</strong> is a special kind of record that stores a list of names and references to those files and/or other directories so the system can organize everything. Imagine in a school, a file is a single room that holds its materials. A directory is a hallway that leads to or contains rooms, as well as branches off into other hallways. This system of rooms and hallways is a <strong>tree</strong>. In the Harvard-Westlake school metaphor, the school campus is the root of the tree, which branches out into buildings (Chalmers, Seaver, etc.), and then further into rooms (Student Lounge) and hallways (Upper Chalmers), that contain their own rooms (Chalmers 305).",
            "<strong>cd</strong> changes your working location. Use <strong>cd filepath</strong> to move into a folder; <strong>cd ..</strong> goes up to the parent; <strong>cd ~</strong> jumps to your home (here, the campus root). After you change location, <strong>ls</strong> shows what’s inside the current directory.",
          ],
          [
            "Every file and directory belongs to an <strong>owner</strong>, which is a single user account responsible for it; it also belongs to a <strong>group</strong>, which is a named team of user accounts, and everyone else on the system is treated as <strong>other</strong>. In the school picture, imagine the Harvard-Westlake school as one person, the owner is that one person who owns a given room, or hallway. The group could for example be the student body, who is also given certain privleges in the room, or hallway. Finally, other(s) are the general public, who may only be granted access to the room or hallway during a public Harvard-Westlake event. The system checks three basic actions for each of these audiences: <strong>read</strong>, <strong>write</strong>, and <strong>execute</strong>. On a file, read means you may view the contents, write means you may change the contents, and execute means you may run it as a program if it is runnable. On a directory, read means you may list the names inside, write means you may add, rename, or remove entries, and execute means you may enter it and move through it when you already know the name of something inside.",
            "<strong>ls -l</strong> shows a “long listing” of the current directory: each item on its own line with its permissions, number of links, owner, group, size, last modified time, and name. This is like reading the hallway roster that lists each room with its posted rules and who is responsible.",
          ],
          [
            "<strong>chmod</strong> changes the rules themselves—who may read, who may write, and who may execute, without changing who owns a file or which group it belongs to. In the school picture, this is like updating the sign on a room’s door: “Teachers may rearrange desks,” “Club members may come in after school,” “Guests may only observe.” The people and clubs don’t change; the posted rules for owner, group, and others do.",
            "<strong>chown</strong> changes who is officially responsible for a file or directory by transferring its owner to a different user account. In the school picture, this is like handing the keys and responsibility for a room from one teacher to another; the room may keep the same posted rules, but the person who counts as “the owner” for permission checks is now different.",
            "<strong>chgrp</strong> changes which team a file or directory is associated with by switching its group. In the school picture, this is like reassigning a room from the Chess Club to the Debate Team; the “group rules” on the door still say what that group may do, but they now apply to the new club rather than the old one.",
          ],
          [
            "Sometimes you need elevated privileges to perform actions on files or directories you do not own. The <strong>sudo</strong> command temporarily runs a command with administrator (root) privileges. For example, if you try to change permissions on a directory owned by someone else, a normal <strong>chmod</strong> will fail with “Operation not permitted.” Prefixing the same command with <strong>sudo</strong> allows it—after authenticating—to proceed so you can, for example, grant <strong>read</strong> and <strong>execute</strong> access where appropriate.",
          ],
        ];

        // ===== Unified Flow State =====
        var sectionIndex = 0;
        var paragraphIndex = -1; // start so first Enter shows the first sentence
        var mode = "text"; // text | demo-cd | demo-ls | demo-ch | end

        // Welcome lines (auto shown)
        appendInstructionHtml(
          "<strong>Welcome!</strong> This terminal will teach you <strong>file permissions</strong> step by step."
        );
        appendInstructionHtml("Press Enter to continue through the lesson.");

        // ===== Demo 1: cd practice =====
        var cd = (function () {
          var path = ["Harvard-Westlake"];
          var tree = {
            name: "Harvard-Westlake",
            children: {
              ChalmersHall: {
                children: {
                  LowerLevel: { children: {} },
                  SecondFloor: {
                    children: {
                      StudentLounge: { children: {} },
                      Cafeteria: { children: {} },
                      DeansOffices: { children: {} },
                    },
                  },
                  ThirdFloor: { children: {} },
                },
              },
              SeaverAcademicCenter: {
                children: { SecondFloor: { children: {} } },
              },
            },
          };
          function getNode(arr) {
            var node = tree;
            for (var i = 1; i < arr.length; i++) {
              var name = arr[i];
              if (!node.children || !node.children[name]) return null;
              node = node.children[name];
            }
            return node;
          }
          function listCurrent() {
            var node = getNode(path);
            return Object.keys((node && node.children) || {}).sort();
          }
          function promptPath() {
            return "~/" + path.join("/");
          }
          var step = 0;
          var free = false;

          function start() {
            mode = "demo-cd";
            appendInstructionHtml(
              '<span class="title-line"><strong>cd practice</strong></span>'
            );
            appendInstructionHtml(
              "Follow the prompts to practice cd and ls. When free practice begins, type <strong>q</strong> and press Enter to continue the lesson."
            );
            updatePrompt("hwwolverine@DESKTOP-WSL", promptPath());
            showNext();
          }
          function showNext() {
            var lines = [
              "Try: cd ChalmersHall",
              "Try: ls",
              "Try: cd SecondFloor",
              "Try: ls",
              "Try: cd ..",
              "Try: ls",
              "Try: cd ~",
              "Try: ls",
              "Try: cd SeaverAcademicCenter",
              "Try: ls",
            ];
            if (step < lines.length) {
              appendInstructionHtml(lines[step]);
            } else {
              appendInstructionHtml(
                "All set! Free practice: use cd and ls. Type <strong>q</strong> to exit."
              );
              free = true;
            }
          }
          function onEnter(cmd) {
            if (!free) {
              // Developer bypass: 's' runs the expected next instruction
              if (cmd === "s") {
                if (step === 0) cmd = "cd ChalmersHall";
                else if (step === 1) cmd = "ls";
                else if (step === 2) cmd = "cd SecondFloor";
                else if (step === 3) cmd = "ls";
                else if (step === 4) cmd = "cd ..";
                else if (step === 5) cmd = "ls";
                else if (step === 6) cmd = "cd ~";
                else if (step === 7) cmd = "ls";
                else if (step === 8) cmd = "cd SeaverAcademicCenter";
                else if (step === 9) cmd = "ls";
              }
              if (step === 0) {
                if (cmd === "cd ChalmersHall") {
                  path.push("ChalmersHall");
                  updatePrompt("hwwolverine@DESKTOP-WSL", promptPath());
                  step = 1;
                  appendInstructionHtml(
                    'Now type "ls" to see what is inside this folder.'
                  );
                } else appendInstructionHtml("Try: cd ChalmersHall");
              } else if (step === 1) {
                if (cmd === "ls") {
                  listCurrent().forEach(function (n) {
                    appendRawLine(
                      '<span class="ls-dir">' + escapeHtml(n) + "</span>"
                    );
                  });
                  step = 2;
                  showNext();
                } else appendInstructionHtml("Try: ls");
              } else if (step === 2) {
                if (cmd === "cd SecondFloor") {
                  path.push("SecondFloor");
                  updatePrompt("hwwolverine@DESKTOP-WSL", promptPath());
                  step = 3;
                  appendInstructionHtml(
                    'Now type "ls" to see what is inside this folder.'
                  );
                } else appendInstructionHtml("Try: cd SecondFloor");
              } else if (step === 3) {
                if (cmd === "ls") {
                  listCurrent().forEach(function (n) {
                    appendRawLine(
                      '<span class="ls-dir">' + escapeHtml(n) + "</span>"
                    );
                  });
                  step = 4;
                  showNext();
                } else appendInstructionHtml("Try: ls");
              } else if (step === 4) {
                if (cmd === "cd ..") {
                  if (path.length > 1) path.pop();
                  updatePrompt("hwwolverine@DESKTOP-WSL", promptPath());
                  step = 5;
                  appendInstructionHtml(
                    'Now type "ls" to see what is inside this folder.'
                  );
                } else appendInstructionHtml("Try: cd ..");
              } else if (step === 5) {
                if (cmd === "ls") {
                  listCurrent().forEach(function (n) {
                    appendRawLine(
                      '<span class="ls-dir">' + escapeHtml(n) + "</span>"
                    );
                  });
                  step = 6;
                  showNext();
                } else appendInstructionHtml("Try: ls");
              } else if (step === 6) {
                if (cmd === "cd ~") {
                  path = ["Harvard-Westlake"];
                  updatePrompt("hwwolverine@DESKTOP-WSL", promptPath());
                  step = 7;
                  appendInstructionHtml(
                    'Now type "ls" to see what is inside this folder.'
                  );
                } else appendInstructionHtml("Try: cd ~");
              } else if (step === 7) {
                if (cmd === "ls") {
                  listCurrent().forEach(function (n) {
                    appendRawLine(
                      '<span class="ls-dir">' + escapeHtml(n) + "</span>"
                    );
                  });
                  step = 8;
                  showNext();
                } else appendInstructionHtml("Try: ls");
              } else if (step === 8) {
                if (cmd === "cd SeaverAcademicCenter") {
                  path = ["Harvard-Westlake", "SeaverAcademicCenter"];
                  updatePrompt("hwwolverine@DESKTOP-WSL", promptPath());
                  step = 9;
                  appendInstructionHtml(
                    'Now type "ls" to see what is inside this folder.'
                  );
                } else appendInstructionHtml("Try: cd SeaverAcademicCenter");
              } else if (step === 9) {
                if (cmd === "ls") {
                  listCurrent().forEach(function (n) {
                    appendRawLine(
                      '<span class="ls-dir">' + escapeHtml(n) + "</span>"
                    );
                  });
                  step = 10;
                  showNext();
                } else appendInstructionHtml("Try: ls");
              }
            } else {
              if (cmd === "q") {
                appendInstructionHtml("Exiting demo...");
                nextSection();
                return;
              }
              if (cmd === "ls") {
                listCurrent().forEach(function (n) {
                  appendRawLine(
                    '<span class="ls-dir">' + escapeHtml(n) + "</span>"
                  );
                });
              } else if (cmd === "cd ..") {
                if (path.length > 1) path.pop();
                updatePrompt("hwwolverine@DESKTOP-WSL", promptPath());
              } else if (cmd === "cd ~") {
                path = ["Harvard-Westlake"];
                updatePrompt("hwwolverine@DESKTOP-WSL", promptPath());
              } else if (cmd.indexOf("cd ") === 0) {
                var tgt = cmd.slice(3).trim();
                if (listCurrent().indexOf(tgt) !== -1) {
                  path.push(tgt);
                  updatePrompt("hwwolverine@DESKTOP-WSL", promptPath());
                }
              }
            }
          }
          return { start: start, onEnter: onEnter };
        })();

        // ===== Demo 2: ls -l practice =====
        var lsDemo = (function () {
          var fs = {
            name: "Harvard-Westlake",
            entries: [
              {
                type: "dir",
                mode: "drwxr-xr-x",
                nlink: 5,
                owner: "hw_admin",
                group: "faculty",
                size: 4096,
                mtime: "Nov 16 12:30",
                name: "ChalmersHall",
              },
              {
                type: "dir",
                mode: "drwxr-xr-x",
                nlink: 5,
                owner: "hw_admin",
                group: "faculty",
                size: 4096,
                mtime: "Nov 16 12:31",
                name: "SeaverAcademicCenter",
              },
            ],
            children: {
              ChalmersHall: {
                entries: [
                  {
                    type: "dir",
                    mode: "drwxr-xr-x",
                    nlink: 3,
                    owner: "hw_admin",
                    group: "faculty",
                    size: 4096,
                    mtime: "Nov 16 12:41",
                    name: "SecondFloor",
                  },
                ],
                children: {
                  SecondFloor: {
                    entries: [
                      {
                        type: "dir",
                        mode: "drwxrwxr-x",
                        nlink: 3,
                        owner: "hw_admin",
                        group: "students",
                        size: 4096,
                        mtime: "Nov 16 13:00",
                        name: "StudentLounge",
                      },
                      {
                        type: "dir",
                        mode: "drwxr-xr-x",
                        nlink: 3,
                        owner: "hw_admin",
                        group: "faculty",
                        size: 4096,
                        mtime: "Nov 16 13:01",
                        name: "Cafeteria",
                      },
                      {
                        type: "dir",
                        mode: "drwxr-xr-x",
                        nlink: 3,
                        owner: "hw_admin",
                        group: "faculty",
                        size: 4096,
                        mtime: "Nov 16 13:02",
                        name: "DeansOffices",
                      },
                    ],
                    children: {
                      StudentLounge: {
                        entries: [
                          {
                            type: "file",
                            mode: "-rw-r--r--",
                            nlink: 1,
                            owner: "hw_admin",
                            group: "students",
                            size: 512,
                            mtime: "Nov 12 09:00",
                            name: "notice_board.md",
                          },
                        ],
                        children: {},
                      },
                      Cafeteria: {
                        entries: [
                          {
                            type: "file",
                            mode: "-rw-r--r--",
                            nlink: 1,
                            owner: "hw_admin",
                            group: "faculty",
                            size: 256,
                            mtime: "Nov 12 08:50",
                            name: "menu.txt",
                          },
                          {
                            type: "file",
                            mode: "-rw-r--r--",
                            nlink: 1,
                            owner: "hw_admin",
                            group: "faculty",
                            size: 384,
                            mtime: "Nov 12 08:55",
                            name: "sandwich_window_menu.txt",
                          },
                        ],
                        children: {},
                      },
                      DeansOffices: { entries: [], children: {} },
                    },
                  },
                },
              },
              SeaverAcademicCenter: { entries: [], children: {} },
            },
          };
          var path = ["Harvard-Westlake", "ChalmersHall", "SecondFloor"];
          function getNode(arr) {
            var node = fs;
            for (var i = 1; i < arr.length; i++) {
              var name = arr[i];
              if (!node.children || !node.children[name]) return null;
              node = node.children[name];
            }
            return node;
          }
          function updatePromptPath() {
            var p = "~/" + path.join("/");
            updatePrompt("hwwolverine@DESKTOP-WSL", p);
          }
          function lsLong() {
            var node = getNode(path);
            var entries = (node && node.entries) || [];
            var total = entries.length * 4;
            appendLine("total " + total);
            for (var i = 0; i < entries.length; i++) {
              var e = entries[i];
              var nameHtml =
                e.type === "dir"
                  ? '<span class="ls-dir">' + escapeHtml(e.name) + "</span>"
                  : escapeHtml(e.name);
              appendRawLine(
                escapeHtml(
                  e.mode +
                    " " +
                    e.nlink +
                    " " +
                    e.owner +
                    " " +
                    e.group +
                    " " +
                    ("" + e.size).padStart(4, " ") +
                    " " +
                    e.mtime +
                    " "
                ) + nameHtml
              );
            }
          }
          var step = 0;
          var free = false;
          function start() {
            mode = "demo-ls";
            appendInstructionHtml(
              '<span class="title-line"><strong>ls -l practice</strong></span>'
            );
            appendInstructionHtml(
              "Follow the prompts. When free practice begins, type <strong>q</strong> and press Enter to continue the lesson."
            );
            updatePromptPath();
            showNext();
          }
          function showNext() {
            switch (step) {
              case 0:
                appendInstructionHtml("Try: ls -l");
                break;
              case 1:
                appendInstructionHtml("Try: cd StudentLounge");
                break;
              case 2:
                appendInstructionHtml("Try: ls -l");
                break;
              case 3:
                appendInstructionHtml("Try: cd ..");
                break;
              case 4:
                appendInstructionHtml("Try: cd Cafeteria");
                break;
              case 5:
                appendInstructionHtml("Try: ls -l");
                break;
              default:
                appendInstructionHtml(
                  "All set! Free practice: use cd and ls -l. Type <strong>q</strong> to exit."
                );
                free = true;
            }
          }
          function onEnter(cmd) {
            if (!free) {
              // Developer bypass: 's' runs the expected next instruction
              if (cmd === "s") {
                if (step === 0) cmd = "ls -l";
                else if (step === 1) cmd = "cd StudentLounge";
                else if (step === 2) cmd = "ls -l";
                else if (step === 3) cmd = "cd ..";
                else if (step === 4) cmd = "cd Cafeteria";
                else if (step === 5) cmd = "ls -l";
              }
              if (step === 0) {
                if (cmd === "ls -l") {
                  lsLong();
                  step = 1;
                  showNext();
                } else appendInstructionHtml("Try: ls -l");
              } else if (step === 1) {
                if (cmd === "cd StudentLounge") {
                  path.push("StudentLounge");
                  updatePromptPath();
                  step = 2;
                  showNext();
                } else appendInstructionHtml("Try: cd StudentLounge");
              } else if (step === 2) {
                if (cmd === "ls -l") {
                  lsLong();
                  step = 3;
                  showNext();
                } else appendInstructionHtml("Try: ls -l");
              } else if (step === 3) {
                if (cmd === "cd ..") {
                  if (path.length > 1) path.pop();
                  updatePromptPath();
                  step = 4;
                  showNext();
                } else appendInstructionHtml("Try: cd ..");
              } else if (step === 4) {
                if (cmd === "cd Cafeteria") {
                  path.push("Cafeteria");
                  updatePromptPath();
                  step = 5;
                  showNext();
                } else appendInstructionHtml("Try: cd Cafeteria");
              } else if (step === 5) {
                if (cmd === "ls -l") {
                  lsLong();
                  step = 6;
                  showNext();
                } else appendInstructionHtml("Try: ls -l");
              }
            } else {
              if (cmd === "q") {
                appendInstructionHtml("Exiting demo...");
                nextSection();
                return;
              }
              if (cmd === "ls -l") {
                lsLong();
              }
            }
          }
          return { start: start, onEnter: onEnter };
        })();

        // ===== Demo 3: chmod/chown/chgrp practice =====
        var chDemo = (function () {
          var file = {
            mode: "-rw-r--r--",
            nlink: 1,
            owner: "hw_admin",
            group: "students",
            size: 1024,
            mtime: "Nov 17 09:00",
            name: "demo.sh",
          };
          var nav = {
            name: "Harvard-Westlake",
            children: {
              ChalmersHall: { children: { SecondFloor: { children: {} } } },
              SeaverAcademicCenter: { children: {} },
            },
          };
          var navPath = ["Harvard-Westlake", "ChalmersHall"];
          function listDirNames() {
            var node = nav;
            for (var i = 1; i < navPath.length; i++) {
              var name = navPath[i];
              if (!node.children || !node.children[name]) return [];
              node = node.children[name];
            }
            return Object.keys(node.children || {}).sort();
          }
          function updatePromptPath() {
            updatePrompt("hwwolverine@DESKTOP-WSL", "~/" + navPath.join("/"));
          }
          function lsLong() {
            appendLine("total 4");
            appendRawLine(
              escapeHtml(
                file.mode +
                  " " +
                  file.nlink +
                  " " +
                  file.owner +
                  " " +
                  file.group +
                  " " +
                  ("" + file.size).padStart(4, " ") +
                  " " +
                  file.mtime +
                  " " +
                  file.name
              )
            );
          }
          function applyChmod(spec) {
            var m = /^([ugoa]+)([+\-=])([rwx]+)$/.exec(spec);
            if (!m) return false;
            var who = m[1];
            var op = m[2];
            var perms = m[3];
            var current = file.mode.slice(1);
            var parts = [
              current.slice(0, 3).split(""),
              current.slice(3, 6).split(""),
              current.slice(6, 9).split(""),
            ];
            function idxs(w) {
              var set = [];
              if (w.indexOf("a") !== -1) return [0, 1, 2];
              if (w.indexOf("u") !== -1) set.push(0);
              if (w.indexOf("g") !== -1) set.push(1);
              if (w.indexOf("o") !== -1) set.push(2);
              return set.length ? set : [0];
            }
            function bits(p) {
              return {
                r: p.indexOf("r") !== -1,
                w: p.indexOf("w") !== -1,
                x: p.indexOf("x") !== -1,
              };
            }
            var b = bits(perms);
            var targets = idxs(who);
            for (var t = 0; t < targets.length; t++) {
              var tri = parts[targets[t]];
              if (op === "+") {
                if (b.r) tri[0] = "r";
                if (b.w) tri[1] = "w";
                if (b.x) tri[2] = "x";
              } else if (op === "-") {
                if (b.r) tri[0] = "-";
                if (b.w) tri[1] = "-";
                if (b.x) tri[2] = "-";
              } else if (op === "=") {
                tri[0] = b.r ? "r" : "-";
                tri[1] = b.w ? "w" : "-";
                tri[2] = b.x ? "x" : "-";
              }
            }
            file.mode =
              "-" + parts[0].join("") + parts[1].join("") + parts[2].join("");
            return true;
          }
          var step = 0;
          var free = false;
          function start() {
            mode = "demo-ch";
            appendInstructionHtml(
              '<span class="title-line"><strong>chmod, chown, chgrp practice</strong></span>'
            );
            appendInstructionHtml(
              "Follow the prompts. When free practice begins, type <strong>q</strong> and press Enter to continue the lesson."
            );
            updatePromptPath();
            showNext();
          }
          function showNext() {
            switch (step) {
              case 0:
                appendInstructionHtml("Try: ls -l");
                break;
              case 1:
                appendInstructionHtml("Try: chmod u+x demo.sh");
                break;
              case 2:
                appendInstructionHtml("Try: chown teacher_lee demo.sh");
                break;
              case 3:
                appendInstructionHtml("Try: chgrp faculty demo.sh");
                break;
              default:
                appendInstructionHtml(
                  "All set! Free practice. Type <strong>q</strong> to exit."
                );
                free = true;
            }
          }
          function onEnter(cmd) {
            if (!free) {
              // Developer bypass: 's' runs the expected next instruction
              if (cmd === "s") {
                if (step === 0) cmd = "ls -l";
                else if (step === 1) cmd = "chmod u+x demo.sh";
                else if (step === 2) cmd = "chown teacher_lee demo.sh";
                else if (step === 3) cmd = "chgrp faculty demo.sh";
              }
              if (step === 0) {
                if (cmd === "ls -l") {
                  lsLong();
                  step = 1;
                  showNext();
                } else appendInstructionHtml("Try: ls -l");
              } else if (step === 1) {
                if (cmd === "chmod u+x demo.sh") {
                  applyChmod("u+x");
                  lsLong();
                  step = 2;
                  showNext();
                } else appendInstructionHtml("Try: chmod u+x demo.sh");
              } else if (step === 2) {
                var m1 = /^chown\s+(\S+)\s+(\S+)$/.exec(cmd);
                if (m1 && m1[1] === "teacher_lee" && m1[2] === file.name) {
                  file.owner = "teacher_lee";
                  lsLong();
                  step = 3;
                  showNext();
                } else appendInstructionHtml("Try: chown teacher_lee demo.sh");
              } else if (step === 3) {
                var m2 = /^chgrp\s+(\S+)\s+(\S+)$/.exec(cmd);
                if (m2 && m2[1] === "faculty" && m2[2] === file.name) {
                  file.group = "faculty";
                  lsLong();
                  step = 4;
                  showNext();
                } else appendInstructionHtml("Try: chgrp faculty demo.sh");
              }
            } else {
              if (cmd === "q") {
                appendInstructionHtml("Exiting demo...");
                nextSection();
                return;
              }
              if (cmd === "ls -l") {
                lsLong();
              } else if (/^chmod\s+([ugoa][+\-=][rwx]+)\s+(\S+)$/.test(cmd)) {
                var cm = /^chmod\s+([ugoa][+\-=][rwx]+)\s+(\S+)$/.exec(cmd);
                if (cm && cm[2] === file.name) {
                  if (applyChmod(cm[1])) lsLong();
                }
              } else if (/^chown\s+(\S+)\s+(\S+)$/.test(cmd)) {
                var c1 = /^chown\s+(\S+)\s+(\S+)$/.exec(cmd);
                if (c1 && c1[2] === file.name) {
                  file.owner = c1[1];
                  lsLong();
                }
              } else if (/^chgrp\s+(\S+)\s+(\S+)$/.test(cmd)) {
                var c2 = /^chgrp\s+(\S+)\s+(\S+)$/.exec(cmd);
                if (c2 && c2[2] === file.name) {
                  file.group = c2[1];
                  lsLong();
                }
              }
            }
          }
          return { start: start, onEnter: onEnter };
        })();

        // ===== Demo 4: sudo scenario =====
        var sudoDemo = (function () {
          var sudoPassword = "r7Qx9Za"; // 7-char random-looking string
          var nav = {
            name: "Harvard-Westlake",
            children: {
              ChalmersHall: { children: { RestrictedArea: { children: {} } } },
              SeaverAcademicCenter: { children: {} },
            },
          };
          var navPath = ["Harvard-Westlake", "ChalmersHall"];
          var restrictedPerm = { otherRead: false, otherExec: false };
          var awaitingPassword = false;

          function updatePromptPath() {
            updatePrompt("hwwolverine@DESKTOP-WSL", "~/" + navPath.join("/"));
          }
          function canCdRestricted() {
            return restrictedPerm.otherExec;
          }
          function sudoUserName() {
            var at = (currentUserhost || "").indexOf("@");
            return at !== -1
              ? currentUserhost.slice(0, at)
              : currentUserhost || "user";
          }

          var step = 0;
          var free = false;

          function start() {
            mode = "demo-sudo";
            appendInstructionHtml(
              '<span class="title-line"><strong>sudo practice</strong></span>'
            );
            appendInstructionHtml(
              "Follow the prompts. When free practice begins, type <strong>q</strong> and press Enter to finish."
            );
            updatePromptPath();
            showNext();
          }
          function showNext() {
            switch (step) {
              case 0:
                appendInstructionHtml("Try: cd RestrictedArea");
                break;
              case 1:
                appendInstructionHtml("Try: chmod o+r RestrictedArea");
                break;
              case 2:
                appendInstructionHtml(
                  "Try: sudo chmod o+rx RestrictedArea (password: " +
                    sudoPassword +
                    ")"
                );
                break;
              case 3:
                appendInstructionHtml("Try: cd RestrictedArea");
                break;
              default:
                appendInstructionHtml(
                  "All set! Free practice. Type <strong>q</strong> to exit."
                );
                free = true;
            }
          }
          function onEnter(cmd) {
            if (!free) {
              // Developer bypass
              if (cmd === "s") {
                if (step === 0) cmd = "cd RestrictedArea";
                else if (step === 1) cmd = "chmod o+r RestrictedArea";
                else if (step === 2) cmd = "sudo chmod o+rx RestrictedArea";
                else if (step === 3) cmd = "cd RestrictedArea";
              }
              // Handle password input if awaiting
              if (awaitingPassword) {
                if (cmd === sudoPassword) {
                  restrictedPerm.otherRead = true;
                  restrictedPerm.otherExec = true;
                  awaitingPassword = false;
                  hideInput = false;
                  step = 3;
                  showNext();
                } else {
                  appendLine("Sorry, try again.");
                  appendLine("[sudo] password for " + sudoUserName() + ":");
                  hideInput = true;
                }
                return;
              }
              if (step === 0) {
                if (cmd === "cd RestrictedArea") {
                  if (!canCdRestricted()) {
                    appendLine("bash: cd: RestrictedArea: Permission denied");
                    appendInstructionHtml(
                      "You need execute permission to enter a directory; others don’t have it here."
                    );
                    step = 1;
                    showNext();
                  } else {
                    navPath.push("RestrictedArea");
                    updatePromptPath();
                    step = 4;
                    showNext();
                  }
                } else appendInstructionHtml("Try: cd RestrictedArea");
              } else if (step === 1) {
                if (cmd === "chmod o+r RestrictedArea") {
                  appendLine(
                    "chmod: changing permissions of 'RestrictedArea': Operation not permitted"
                  );
                  appendInstructionHtml(
                    "You don’t own this directory. Use administrator privileges to change its permissions."
                  );
                  step = 2;
                  showNext();
                } else appendInstructionHtml("Try: chmod o+r RestrictedArea");
              } else if (step === 2) {
                if (cmd === "sudo chmod o+rx RestrictedArea") {
                  appendLine("[sudo] password for " + sudoUserName() + ":");
                  awaitingPassword = true;
                  hideInput = true;
                } else
                  appendInstructionHtml(
                    "Try: sudo chmod o+rx RestrictedArea (password: " +
                      sudoPassword +
                      ")"
                  );
              } else if (step === 3) {
                if (cmd === "cd RestrictedArea") {
                  if (canCdRestricted()) {
                    navPath.push("RestrictedArea");
                    updatePromptPath();
                    appendInstructionHtml(
                      "<strong>Great job!</strong> You elevated privileges appropriately and accessed the directory."
                    );
                    endLesson();
                  } else {
                    appendLine("bash: cd: RestrictedArea: Permission denied");
                  }
                } else appendInstructionHtml("Try: cd RestrictedArea");
              }
            } else {
              if (cmd === "q") {
                appendInstructionHtml("Exiting demo...");
                endLesson();
                return;
              }
            }
          }
          return { start: start, onEnter: onEnter };
        })();

        function nextSection() {
          if (mode === "demo-cd") {
            // After cd demo, show section 2 (ownership/rwx + ls -l text), then ls demo
            sectionIndex = 1;
            paragraphIndex = -1;
            mode = "text";
            appendInstructionHtml("Press Enter to continue the lesson.");
          } else if (mode === "demo-ls") {
            // After ls demo, show section 3 (chmod/chown/chgrp), then ch demo
            sectionIndex = 2;
            paragraphIndex = -1;
            mode = "text";
            appendInstructionHtml("Press Enter to continue the lesson.");
          } else if (mode === "demo-ch") {
            // After ch demo, show sudo explanation then sudo demo
            sectionIndex = 3;
            paragraphIndex = -1;
            mode = "text";
            appendInstructionHtml("Press Enter to continue the lesson.");
          }
        }

        function endLesson() {
          mode = "end";
          appendInstructionHtml(
            "The lesson is complete. You can keep practicing here or refresh to restart."
          );
        }

        function startNextDemoForSection(idx) {
          if (idx === 0) {
            cd.start();
          } else if (idx === 1) {
            lsDemo.start();
          } else if (idx === 2) {
            chDemo.start();
          } else if (idx === 3) {
            sudoDemo.start();
          }
        }

        // Handle input
        function onKeyDown(e) {
          if (e.key !== "Enter") return;
          e.preventDefault();
          var raw = (input.textContent || "").replace(/\r?\n/g, "");
          var cmd = raw.trim();

          // finalize the current input line to look like a real terminal
          finalizeCurrentInput(raw);

          if (mode === "text") {
            paragraphIndex++;
            var group = textSections[sectionIndex] || [];
            if (paragraphIndex < 0) {
              // advancing through preface lines; no output
            } else if (paragraphIndex < group.length) {
              appendInstructionHtml(group[paragraphIndex]);
              if (sectionIndex === 0 && paragraphIndex === group.length - 1) {
                appendInstructionHtml(
                  "Next: a guided <strong>cd</strong> demo will begin."
                );
              } else if (
                sectionIndex === 1 &&
                paragraphIndex === group.length - 1
              ) {
                appendInstructionHtml(
                  "Next: a guided <strong>ls -l</strong> demo will begin."
                );
              } else if (
                sectionIndex === 2 &&
                paragraphIndex === group.length - 1
              ) {
                appendInstructionHtml(
                  "Next: a guided <strong>chmod/chown/chgrp</strong> demo will begin."
                );
              }
            } else {
              // start corresponding demo
              startNextDemoForSection(sectionIndex);
            }
          } else if (mode === "demo-cd") {
            cd.onEnter(cmd);
          } else if (mode === "demo-ls") {
            lsDemo.onEnter(cmd);
          } else if (mode === "demo-ch") {
            chDemo.onEnter(cmd);
          } else if (mode === "demo-sudo") {
            sudoDemo.onEnter(cmd);
          } else if (mode === "end") {
            // free typing after lesson ends; no-op
          }

          // after processing, create a fresh prompt line
          createInputLine();
        }

        // Initial prompt
        updatePrompt("hwwolverine@DESKTOP-WSL", "~/Harvard-Westlake");
        createInputLine();
      })();
    </script>
  </body>
</html>
